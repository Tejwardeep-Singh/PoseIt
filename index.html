<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071014">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/camera.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/responsive.css">
    <title>PoseIt - AI Photography Assistant</title>
  </head>
  <body>
    <div id="loadingScreen" class="loading-screen" role="status" aria-live="polite">
      <div class="loader-mark" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p>Loading PoseIt camera intelligence...</p>
    </div>

    <main class="app-shell">
      <header class="top-bar">
        <a class="brand" href="#" aria-label="PoseIt home">
          <span class="brand-mark">P</span>
          <span>PoseIt</span>
        </a>
        <div class="top-actions">
          <button id="switchCameraButton" class="icon-button" type="button" title="Switch camera" aria-label="Switch camera">
            <span aria-hidden="true">⇄</span>
          </button>
          <button id="settingsButton" class="icon-button" type="button" title="Settings" aria-label="Open settings">
            <span aria-hidden="true">⚙</span>
          </button>
        </div>
      </header>

      <section id="cameraScreen" class="camera-screen" aria-label="Camera">
        <div class="camera-wrap">
          <video id="cameraVideo" class="camera-video" playsinline muted></video>
          <canvas id="cameraCanvas" class="camera-canvas"></canvas>
          <div id="cameraGrid" class="camera-grid" aria-hidden="true"></div>
          <div id="countdown" class="countdown" aria-live="assertive"></div>
          <div id="cameraError" class="camera-error" hidden></div>
        </div>

        <aside class="control-rail" aria-label="Pose guidance">
          <section class="status-panel">
            <div class="match-ring" aria-label="Pose match score">
              <svg viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
                <circle id="matchRing" class="ring-value" cx="60" cy="60" r="52"></circle>
              </svg>
              <div>
                <strong id="matchScore">0%</strong>
                <span>Pose Match</span>
              </div>
            </div>

            <label class="field-label" for="poseSelect">Target Pose</label>
            <select id="poseSelect" class="pose-select"></select>

            <div id="guidanceBox" class="guidance-box" aria-live="polite">
              Step into frame to begin.
            </div>

            <div class="signal-grid">
              <div>
                <span>Face</span>
                <strong id="faceStatus">Waiting</strong>
              </div>
              <div>
                <span>Frame</span>
                <strong id="frameStatus">Waiting</strong>
              </div>
              <div>
                <span>Light</span>
                <strong id="lightStatus">Checking</strong>
              </div>
            </div>
          </section>

          <section class="filter-panel" aria-label="Filters">
            <label class="field-label" for="filterSelect">Filter</label>
            <select id="filterSelect" class="pose-select">
              <option value="none">Original</option>
              <option value="warm">Warm</option>
              <option value="cool">Cool</option>
              <option value="portrait">Portrait</option>
              <option value="mono">Black & White</option>
              <option value="vintage">Vintage</option>
            </select>
          </section>
        </aside>
      </section>

      <section id="previewScreen" class="preview-screen" hidden aria-label="Captured photo preview">
        <div class="preview-media">
          <img id="capturedImage" alt="Captured PoseIt photo">
        </div>
        <div class="preview-actions">
          <button id="downloadButton" class="primary-button" type="button">Download</button>
          <button id="retakeButton" class="secondary-button" type="button">Retake</button>
          <button id="backButton" class="ghost-button" type="button">Back to Camera</button>
        </div>
      </section>

      <footer class="capture-dock" aria-label="Camera controls">
        <button id="manualCaptureButton" class="shutter-button" type="button" aria-label="Capture photo">
          <span></span>
        </button>
      </footer>
    </main>

    <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
      <form method="dialog">
        <div class="dialog-head">
          <h2 id="settingsTitle">Settings</h2>
          <button class="icon-button" value="close" aria-label="Close settings" title="Close settings">×</button>
        </div>
        <div id="settingsList" class="settings-list"></div>
      </form>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" defer></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
